<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UberX x SpaceX - Splash</title>
    <link rel="stylesheet" href="../css/app.css">
</head>
<body class="home-background">
    <div class="container page-entrance">
    <header class="visually-hidden">
        <h1>UberX x SpaceX - Fleet Management System</h1>
    </header>

    <a href="home.html" class="splash-container">
    <main class="splash-content">
        <div class="logo-image-wrapper">
            <svg class="orbital-svg" viewBox="0 0 300 300" xmlns="http://www.w3.org/2000/svg">
                <defs>
                    <linearGradient id="orbit-grad" x1="0%" y1="0%" x2="100%" y2="0%">
                        <stop offset="0%" style="stop-color:var(--accent); stop-opacity:0" />
                        <stop offset="50%" style="stop-color:var(--accent); stop-opacity:1" />
                        <stop offset="100%" style="stop-color:var(--accent); stop-opacity:0" />
                    </linearGradient>
                </defs>
                <ellipse class="orbit-path" cx="150" cy="150" rx="140" ry="60" fill="none" stroke="url(#orbit-grad)" stroke-width="8" />
            </svg>
            
            <img src="../assets/img/UBERX.png" alt="UberX Logo" class="splash-logo-img">
        </div>
    </main>
</a>
</div>
</body>
</html>
