<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Booking Receipt</title>
    <link rel="stylesheet" href="../css/app.css" />
  </head>
  <div class="container page-entrance">
      <div class="receipt-card">
        <header class="receipt-header">
          <div class="top-navigation">
            <a href="travel.html" class="btn-back-circle">
              <span class="arrow-icon">←</span>
            </a>
          </div>
          <p class="receipt-name">Receipt</p>
          <div class="receipt-total">$859.50</div>
          <p class="airline-name">SpaceX Airline</p>
          <p class="receipt-date">15th Oct 2024, 08:15 AM</p>
        </header>

        <div class="receipt-divider"></div>

        <section class="flight-details">
          <h3 class="section-title">Flight Details</h3>

          <div class="flight-route">
            <div class="route-point">
              <span class="airport-code">JFK</span>
              <span class="flight-time">10:30 AM</span>
            </div>
            <div class="route-icon">
              <img
                src="../assets/img/airplane2-img.png"
                alt="icon"
                class="plane-svg"
              />
              <div class="route-line"></div>
            </div>
            <img
                src="../assets/img/airplane-img.png"
                alt="icon"
                class="plane-svg"
              />
            <div class="route-point">
              <span class="airport-code">LAX</span>
              <span class="flight-time">01:45 PM</span>
            </div>
          </div>

          <div class="flight-info-grid">
            <div class="info-item">
              <span class="label">Flight Number</span>
              <span class="value">AN123</span>
            </div>
            <div class="info-item">
              <span class="label">Seat</span>
              <span class="value">24A</span>
            </div>
          </div>
        </section>

        <section class="price-breakdown">
          <div class="price-row">
            <span>Fare</span>
            <span>$780.00</span>
          </div>
          <div class="price-row">
            <span>Taxes & Fees</span>
            <span>$79.50</span>
          </div>
          <div class="price-row total-row">
            <span>Total</span>
            <span>$859.50</span>
          </div>
        </section>

        <footer class="receipt-footer">
          <div class="footer-item">
            <div class="icon-box">💳</div>
            <div class="footer-text">
              <span class="label">Payment Method</span>
              <span class="value">Amex **** 5678</span>
            </div>
          </div>
          <div class="footer-item">
            <div class="icon-box">🏷️</div>
            <div class="footer-text">
              <span class="label">Category</span>
              <span class="badge-travel">Travel</span>
            </div>
          </div>
        </footer>
       </div>
        <div class="bottom-nav-receipt">
        <a href="#" class="action-btn-pay" aria-label="Compartir">
        <span>🔗</span>
        </a>
        <a href="#" class="action-btn-pay" aria-label="Descargar">
        <span>📥</span>
        </a>
        <a href="#" class="action-btn-pay" aria-label="Editar">
        <span>✏️</span>
        </a>
        </div>
    </div>
  </body>
</html>
