<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>UberX - Travel Map</title>
    <link rel="stylesheet" href="../css/app.css" />
  </head>
  <body>
    <div class="container page-entrance">
      <header class="map-view">
        <header class="map-view">
          <a
            href="home.html"
            class="btn-back"
            aria-label="Volver a Inicio"
            style="
              position: absolute;
              z-index: 10;
              top: 20px;
              left: 20px;
              text-decoration: none;
            "
          >
            <span aria-hidden="true">←</span>
          </a>

          <img src="../assets/img/earth.png" alt="Earth" />
        </header>
        <img src="../assets/img/earth.png" alt="Earth" />
        <div class="floating-chip chip-earth">
          <span>Earth</span>
        </div>
        <div class="floating-chip chip-mars">
          <span>Mars</span>
        </div>

        <svg class="route-arc" viewBox="0 0 400 300">
          <path
            d="M50 30 Q 200 50, 350 150"
            fill="none"
            stroke="rgba(255,255,255,0.3)"
            stroke-width="2"
            stroke-dasharray="8 8"
          />
        </svg>
      </header>

      <main class="travel-content visually-hidden">
        <h1>Select Your Vehicle</h1>
      </main>

      <input type="checkbox" id="sheet-toggle" class="visually-hidden" />

      <section class="bottom-sheet">
        <input
          type="checkbox"
          id="detail-view-toggle"
          class="visually-hidden"
        />

        <label for="sheet-toggle" class="sheet-handle"></label>

        <div class="sheet-collapsed-content">
          <img
            src="../assets/icons/crew-dragon.png"
            alt="Crew Dragon"
            class="vehicle-thumb-lg"
          />
          <div class="launch-info">
            <h3>Next Launch</h3>
            <p class="launch-duration secondary-text">18 Days, 13 Hours</p>
          </div>
          <div class="price-info">
            <span class="currency">Token</span>
            <span class="price-lg">48.5</span>
            <img
              src="../assets/icons/token.png"
              alt="token icon"
              class="token-icon-sm"
            />
          </div>
        </div>

        <ul class="vehicle-list">
          <label for="detail-view-toggle" class="vehicle-item-label">
            <li class="vehicle-item active">
              <img
                src="../assets/icons/crew-dragon.png"
                alt="Crew Dragon"
                class="vehicle-thumb"
              />
              <div class="vehicle-details">
                <h4>Crew Dragon</h4>
                <p class="vehicle-meta secondary-text">SpaceX</p>
              </div>
              <span class="vehicle-price">48.5</span>
              <img
                src="../assets/icons/token.png"
                alt="token icon"
                class="token-icon-sm"
              />
            </li>
          </label>
          <label for="detail-view-toggle" class="vehicle-item-label">
            <li class="vehicle-item inactive">
              <img
                src="../assets/icons/starliner.png"
                alt="Starliner"
                class="vehicle-thumb"
              />
              <div class="vehicle-details">
                <h4>Starliner</h4>
                <p class="vehicle-meta secondary-text">Next Launch</p>
              </div>
              <span class="vehicle-price">48.5</span>
              <img
                src="../assets/icons/token.png"
                alt="token icon"
                class="token-icon-sm"
              />
            </li>
            <label for="detail-view-toggle" class="vehicle-item-label">
              <li class="vehicle-item inactive">
                <img
                  src="../assets/icons/dream_chaser.png"
                  alt="Dream Chaser"
                  class="vehicle-thumb"
                />
                <div class="vehicle-details">
                  <h4>Dream Chaser</h4>
                  <p class="vehicle-meta secondary-text">Next Launch</p>
                </div>
                <span class="vehicle-price">48.5</span>
                <img
                  src="../assets/icons/token.png"
                  alt="token icon"
                  class="token-icon-sm"
                />
              </li>
            </label>
          </label>
        </ul>

        <div class="vehicle-detail-view">
          <p class="surge-notice">Fares are higher due to space debris</p>
          <img
            src="../assets/icons/crew-dragon1.png"
            alt="Crew Dragon Large"
            class="detail-main-img"
          />

          <div class="detail-header">
            <div class="detail-title-group">
              <h2>Crew Dragon <small>👤7</small></h2>
              <p>Next Launch: 12/03/53, 19:30</p>
              <p class="secondary-text">Journey duration: 18 Days, 13 Hours</p>
            </div>
            <div class="detail-price">
              <span>48.5</span>
              <img
                src="../assets/icons/token.png"
                alt="token icon"
                class="token-icon"
              />
            </div>
          </div>
        </div>

        <footer class="sheet-actions">
          <a href="payment-methods.html" class="btn-connect-wallet">
            <div class="wallet-icon-placeholder"></div>
            <img
              src="../assets/icons/wallet.png"
              alt="wallet-icon"
              class="wallet-icon"
            />
            <span>Connect Wallet</span>
            <span class="arrow-right">›</span>
          </a>

          <div class="swipe-container">
            <input
              type="range"
              min="0"
              max="100"
              value="0"
              class="confirm-slider"
              id="confirm-booking"
            />
            <span class="swipe-label secondary-text"
              >Swipe to Confirm Your Booking</span
            >
          </div>
        </footer>
      </section>
    </div>
    <script>
      const confirmSlider = document.getElementById("confirm-booking");

      confirmSlider.addEventListener("input", (e) => {
        if (e.target.value === "100") {
          // Pequeño retraso para que el usuario vea el cambio de color a verde
          setTimeout(() => {
            window.location.href = "receipt.html";
          }, 200);
        }
      });
    </script>
  </body>
</html>
